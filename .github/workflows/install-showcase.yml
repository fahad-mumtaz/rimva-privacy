name: Publish Rimva premium showcase

on:
  push:
    paths:
      - 'Rimva_Premium_Illustrated_Showcase_4_PNGs.zip'
      - '.github/workflows/install-showcase.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-showcase:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install verified illustrations and update README
        run: python3 .github/scripts/install_showcase.py
      - name: Commit installed images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md assets/showcase Rimva_Premium_Illustrated_Showcase_4_PNGs.zip
          if ! git diff --cached --quiet; then
            git commit -m "Add Rimva premium workflow showcase"
            git push
          fi
