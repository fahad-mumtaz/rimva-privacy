name: Publish Rimva premium showcase

on:
  push:
    paths:
      - Rimva_Premium_Illustrated_Showcase_4_PNGs.zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-showcase:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Rimva privacy repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verify and install original selected illustrations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,struct
          archive=Path('Rimva_Premium_Illustrated_Showcase_4_PNGs.zip')
          expected={
            '01-workspace-backup-illustration.png':(1672,941),
            '02-ghl-export-summary-illustration.png':(1448,1086),
            '03-website-capture-illustration.png':(1672,941),
            '04-website-snapshot-result-illustration.png':(1448,1086),
          }
          if not archive.exists():
              raise SystemExit('Upload the exact showcase ZIP to repository root')
          dest=Path('assets/showcase')
          dest.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(archive) as z:
              if set(z.namelist())!=set(expected):
                  raise SystemExit('Unexpected showcase files')
              for name,dims in expected.items():
                  info=z.getinfo(name)
                  if info.file_size>9_000_000:raise SystemExit('Too large: '+name)
                  contents=z.read(name)
                  if contents[:8]!=b'\x89PNG\r\n\x1a\n':
                      raise SystemExit('Invalid PNG: '+name)
                  size=struct.unpack('>II',contents[16:24])
                  if size!=dims:raise SystemExit('Invalid size: '+name)
                  (dest/name).write_bytes(contents)
          readme=Path('README.md')
          body=readme.read_text(encoding='utf-8')
          anchor='## Real extension screenshots · v11.2.5'
          if anchor not in body:
              raise SystemExit('Cannot find README gallery anchor')
          if '## Illustrated workflow showcase' not in body:
              section="""## Illustrated workflow showcase

These four **Rimva-branded promotional illustrations** visualize backup and published website capture. They are not native Chrome screenshots, and their composited interfaces are **illustrative**, not evidence of a current feature state or production test. The verified real extension screenshots are in the next section.

| GHL backup selection | Export result and category coverage |
| :---: | :---: |
| <img src="assets/showcase/01-workspace-backup-illustration.png" alt="Rimva promotional visualization of selecting a GoHighLevel workspace backup" width="100%"> | <img src="assets/showcase/02-ghl-export-summary-illustration.png" alt="Rimva promotional visualization of GHL export completion and category summary, based on historical export flow" width="100%"> |

| Published website capture | Website snapshot result |
| :---: | :---: |
| <img src="assets/showcase/03-website-capture-illustration.png" alt="Rimva promotional illustration of published website capture" width="100%"> | <img src="assets/showcase/04-website-snapshot-result-illustration.png" alt="Rimva promotional illustration of website snapshot completion" width="100%"> |

> **Evidence note:** The separate historical GHL export run occurred before the Rimva rebrand. Visual recreation of an old screen with the Rimva name must not be described as an original capture from the current release. The published website capture and v11.2.5 application screens are documented separately.

---

"""
              body=body.replace(anchor,section+anchor,1)
              readme.write_text(body,encoding='utf-8')
          archive.unlink()
          print('Installed four full-resolution visuals and README gallery')
          PY
      - name: Commit showcase and remove uploaded transfer ZIP
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md assets/showcase Rimva_Premium_Illustrated_Showcase_4_PNGs.zip
          if ! git diff --cached --quiet; then
            git commit -m "Publish selected full-resolution Rimva showcase illustrations"
            git push
          fi
